# Central Logging PVC — uses AWS EFS (ReadWriteMany)
# Prerequisites:
#   1. Install AWS EFS CSI Driver:  kubectl apply -k "github.com/kubernetes-sigs/aws-efs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-2.1"
#   2. Create an EFS file system in the same VPC as your EKS cluster
#   3. Create a StorageClass pointing to your EFS file system ID

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-CHANGE_ME # ← Replace with your EFS file system ID
  directoryPerms: "700"
  basePath: "/central-log-system"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: central-logs-pvc
  namespace: central-log-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
