##############################################################
# SECRETS — Replace ALL placeholder values before deploying!
# To base64 encode: echo -n "your-value" | base64
# Or use stringData (plain text, auto-encoded by K8s)
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: central-log-system
type: Opaque
stringData:
  AUTH_DB_USERNAME: "auth_user"
  AUTH_DB_PASSWORD: "CHANGE_ME_auth_password"
  FACULTY_DB_USERNAME: "faculty_user"
  FACULTY_DB_PASSWORD: "CHANGE_ME_faculty_password"
  STUDENT_DB_USERNAME: "student_user"
  STUDENT_DB_PASSWORD: "CHANGE_ME_student_password"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: central-log-system
type: Opaque
stringData:
  # Generate with: openssl rand -hex 64
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_64"

  RABBITMQ_USERNAME: "guest"
  RABBITMQ_PASSWORD: "CHANGE_ME_rabbitmq_password"

  # Cloudinary (Student Service file uploads)
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME"
  CLOUDINARY_API_KEY: "CHANGE_ME"
  CLOUDINARY_API_SECRET: "CHANGE_ME"
