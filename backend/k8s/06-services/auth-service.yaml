apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: central-log-system
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: central-log-system-sa
      containers:
        - name: auth-service
          image: central-log-system/auth-service:latest # ← Push to ECR
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: AUTH_SERVICE_PORT
              value: "8081"
            - name: AUTH_DB_HOST
              value: "auth-db-service"
            - name: AUTH_DB_PORT
              value: "5432"
            - name: AUTH_DB_NAME
              value: "authdb"
            - name: AUTH_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: AUTH_DB_USERNAME
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /auth/actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /auth/actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: logs
              mountPath: /var/log/central-log-system
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: central-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: central-log-system
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
