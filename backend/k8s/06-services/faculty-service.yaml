apiVersion: apps/v1
kind: Deployment
metadata:
  name: faculty-service
  namespace: microservices
  labels:
    app: faculty-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faculty-service
  template:
    metadata:
      labels:
        app: faculty-service
    spec:
      serviceAccountName: microservices-sa
      containers:
        - name: faculty-service
          image: colabbridge/faculty-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: FACULTY_SERVICE_PORT
              value: "8082"
            - name: FACULTY_DB_HOST
              value: "faculty-db-service"
            - name: FACULTY_DB_PORT
              value: "5432"
            - name: FACULTY_DB_NAME
              value: "facultydb"
            - name: FACULTY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: FACULTY_DB_USERNAME
            - name: FACULTY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: FACULTY_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: STUDENT_SERVICE_URL
              value: "http://student-service:8083"
            - name: RABBITMQ_HOST
              value: "rabbitmq-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /faculty/actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /faculty/actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /var/log/colabbridge
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: central-logs-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: faculty-service
  namespace: microservices
  labels:
    app: faculty-service
spec:
  type: ClusterIP
  selector:
    app: faculty-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
