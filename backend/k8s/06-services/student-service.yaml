apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: central-log-system
  labels:
    app: student-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      serviceAccountName: central-log-system-sa
      containers:
        - name: student-service
          image: central-log-system/student-service:latest # ← Push to ECR
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: STUDENT_SERVICE_PORT
              value: "8083"
            - name: STUDENT_DB_HOST
              value: "student-db-service"
            - name: STUDENT_DB_PORT
              value: "5432"
            - name: STUDENT_DB_NAME
              value: "studentdb"
            - name: STUDENT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: STUDENT_DB_USERNAME
            - name: STUDENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: STUDENT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: FACULTY_SERVICE_URL
              value: "http://faculty-service:8082"
            - name: RABBITMQ_HOST
              value: "rabbitmq-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_EXCHANGE
              value: "faculty-exchange"
            - name: RABBITMQ_QUEUE
              value: "faculty-queue"
            - name: RABBITMQ_ROUTING_KEY
              value: "faculty-routing-key"
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLOUDINARY_API_SECRET
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /student/actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /student/actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: logs
              mountPath: /var/log/central-log-system
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: central-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: central-log-system
  labels:
    app: student-service
spec:
  type: ClusterIP
  selector:
    app: student-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
