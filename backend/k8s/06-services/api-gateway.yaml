apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: central-log-system
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: central-log-system-sa
      containers:
        - name: api-gateway
          image: central-log-system/api-gateway:latest # ← Push to ECR
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: FACULTY_SERVICE_URL
              value: "http://faculty-service:8082"
            - name: STUDENT_SERVICE_URL
              value: "http://student-service:8083"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: logs
              mountPath: /var/log/central-log-system
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: central-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: central-log-system
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
