apiVersion: v1
kind: ServiceAccount
metadata:
  name: colabbridge-sa
  namespace: colabbridge

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: colabbridge-role
  namespace: colabbridge
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: colabbridge-rolebinding
  namespace: colabbridge
subjects:
  - kind: ServiceAccount
    name: colabbridge-sa
    namespace: colabbridge
roleRef:
  kind: Role
  name: colabbridge-role
  apiGroup: rbac.authorization.k8s.io
