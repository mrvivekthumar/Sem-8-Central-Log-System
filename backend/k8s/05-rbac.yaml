apiVersion: v1
kind: ServiceAccount
metadata:
  name: central-log-system-sa
  namespace: central-log-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: central-log-system-role
  namespace: central-log-system
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: central-log-system-rolebinding
  namespace: central-log-system
subjects:
  - kind: ServiceAccount
    name: central-log-system-sa
    namespace: central-log-system
roleRef:
  kind: Role
  name: central-log-system-role
  apiGroup: rbac.authorization.k8s.io
